name: Sync site artifacts

# 内容发布自动化 —— 对接仓库现有 scripts/generate_site.py
#   作者只需提交 articles/*.md，本工作流自动重建全部派生文件并 push：
#     articles/index.json  feed.xml  sitemap.xml
#     ai-manifest.json    llms-full.txt  llms.txt
#   Cloudflare Builds（已连接 GitHub）随后自动部署上线。
#
# 抗冲突设计（修复旧版 5/6 失败）：
#   旧版在“过时基线”上生成、再 rebase，会与作者手工改的派生文件冲突。
#   本版改为：每次都 git fetch + git reset --hard origin/main，基于“最新主干”
#   重新生成再提交，从根本上消除 rebase/merge 冲突；push 被抢时重试（重取-重置-重生成）。
#
# 重要：作者请勿手工修改上面 6 个派生文件，让本工作流独占它们，否则仍会冲突。

on:
  push:
    branches: [main]
    paths:
      - 'articles/*.md'
      - 'articles/**/*.md'
      - 'about.md'
      - 'src/index.js'
      - 'scripts/generate_site.py'
  workflow_dispatch:

# 串行执行：重叠的 push 排队，避免两个 run 同时 push 互相抢占。
concurrency:
  group: sync-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # generate_site.py 的 git_date() 需要完整历史

      - name: Regenerate & commit derived artifacts
        env:
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DERIVED="articles/index.json feed.xml sitemap.xml ai-manifest.json llms-full.txt llms.txt"

          pushed=0
          for attempt in 1 2 3 4 5; do
            # 始终基于最新主干：重取 + 硬重置，杜绝 rebase 冲突
            git fetch origin "${PUSH_BRANCH}"
            git reset --hard "origin/${PUSH_BRANCH}"

            # 在最新基线上重新生成派生文件
            python3 scripts/generate_site.py

            git add ${DERIVED}
            if git diff --cached --quiet; then
              echo "No derived artifacts changed (attempt ${attempt}); nothing to commit."
              pushed=1
              break
            fi

            git commit -m "chore: sync site artifacts [skip ci]"

            if git push origin "HEAD:${PUSH_BRANCH}"; then
              pushed=1
              echo "Pushed on attempt ${attempt}."
              break
            fi
            echo "Push rejected (attempt ${attempt}); will rebase onto latest and retry."
            sleep 3
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "::error::Push failed after 5 attempts - another actor keeps winning the race."
            exit 1
          fi

          git log -1 --oneline

      - name: Purge Cloudflare cache
        # 可选：在 Settings > Secrets and variables > Actions 添加
        #   CF_API_TOKEN 与 CF_ZONE_ID 后自动清缓存，新文章秒级生效。
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "CF_API_TOKEN / CF_ZONE_ID not set - skipping cache purge."
            echo "Add them as repository secrets to purge on every sync."
            exit 0
          fi
          body=$(python3 -c 'import json;print(json.dumps({"files":["https://bi-chao.com"+p for p in ["/","/feed.xml","/ai-manifest.json","/llms.txt","/llms-full.txt","/sitemap.xml","/articles/index.json"]]},separators=(",",":")))')
          echo "Request body: ${body}"
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -d "$body")
          echo "$resp"
          if echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('success') else 1)"; then
            echo "Cloudflare cache purged."
          else
            echo "::warning::Cloudflare purge failed - the token may lack Zone.Cache.Purge on this zone."
          fi
